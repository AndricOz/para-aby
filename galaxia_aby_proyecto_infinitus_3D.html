// ====== FONDO DE ESTRELLAS — tonos azules ======
function makePrettyStarTexture(size=1024, count=2600){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const r = size/2;
  const bg = g.createRadialGradient(r,r,r*0.2, r,r,r);
  bg.addColorStop(0,'#000a18'); bg.addColorStop(1,'#000000');
  g.fillStyle = bg; g.fillRect(0,0,size,size);
  for(let i=0;i<count;i++){
    const x = Math.random()*size, y = Math.random()*size;
    const base = Math.random()*0.7+0.3;
    const glow = g.createRadialGradient(x,y,0, x,y, Math.random()*2.2+1.6);
    const hp = Math.random();
    // azules, celestes, blancos
    let colOuter = hp < 0.4
      ? 'rgba(100,180,255,'+(0.14*base)+')'   // celeste
      : hp < 0.7
      ? 'rgba(150,220,255,'+(0.12*base)+')'   // azul claro
      : 'rgba(200,230,255,'+(0.10*base)+')';  // blanco azulado
    glow.addColorStop(0,'rgba(255,255,255,'+(0.7*base)+')');
    glow.addColorStop(1, colOuter);
    g.fillStyle = glow; g.beginPath(); g.arc(x,y,Math.random()*1.2+0.6,0,Math.PI*2); g.fill();
  }
  return new THREE.CanvasTexture(c);
}

// ====== GALAXIA ======
const galaxy = new THREE.Group(); scene.add(galaxy);
const phraseCount = Math.max(phrases.length * 6, 180);
const arms = 5, radius = 82, maxH = 22;

function makeTextTexture(text, size=44){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 128;
  const g = c.getContext('2d'); g.clearRect(0,0,c.width,c.height);
  g.font = '800 '+size+'px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  // 16/05/2026: cambié el color de la sombra a un tono azul, para que combine mejor con el fondo y el resto de la galaxia, espero que te guste más así :D

  g.fillStyle = 'rgba(220,240,255,0.98)';
  g.fillText(text, c.width/2, c.height/2);
  return new THREE.CanvasTexture(c);
}

for(let i=0; i<phraseCount; i++){
  const text = phrases[i % phrases.length];
  const tex = makeTextTexture(text, 44);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false }));
  spr.isPhrase = true;
  const perArm = phraseCount/arms;
  const ang = (i % perArm) * (Math.PI*2/perArm);
  const armAng = Math.floor(i/perArm) * (Math.PI*2/arms);
  const dist = Math.pow(i/phraseCount, 0.72) * radius;
  const thickness = Math.pow(1-(dist/radius), 2);
  const x = Math.cos(ang+armAng)*dist, z = Math.sin(ang+armAng)*dist;
  const y = (Math.random()-0.5)*maxH*thickness*0.9;
  spr.position.set(x,y,z); spr.scale.set(20,2.6,1); galaxy.add(spr);
}

// Halo — azul
function makeHaloTexture(size=1024, inner=0.45){
  const c = document.createElement('canvas'); c.width=c.height=size;
  const g = c.getContext('2d'); const r = size/2;
  const grd = g.createRadialGradient(r,r,r*inner, r,r,r);
  grd.addColorStop(0.0,'rgba(100,200,255,0.40)');
  grd.addColorStop(0.35,'rgba(80,160,255,0.30)');
  grd.addColorStop(0.7,'rgba(50,120,255,0.20)');
  grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd; g.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const haloPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(320,320),
  new THREE.MeshBasicMaterial({ map:makeHaloTexture(), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, opacity:0.9 })
);
haloPlane.rotation.x=-Math.PI/2; haloPlane.renderOrder=0.2; scene.add(haloPlane);

// ====== ANIMACIÓN ======
let tw = 0;
function animate(){
  requestAnimationFrame(animate);
  const t = performance.now()*0.001;
  tw = (tw+0.0003)%1;
  starTex.offset.set(tw,0);
  galaxy.rotation.y = t*0.05;
  core.rotation.y = t*0.12;
  photonRing.rotation.z = t*0.18;
  haloPlane.rotation.z = t*0.02;
  controls.update();
  renderer.render(scene,camera);
} animate();

// ====== CORAZONES — doble tap ======
const fx = document.getElementById('fx');
const ctx2 = fx.getContext('2d');
function resizeFx(){
  fx.width  = Math.floor(innerWidth  * Math.min(2,window.devicePixelRatio||1));
  fx.height = Math.floor(innerHeight * Math.min(2,window.devicePixelRatio||1));
  fx.style.width  = innerWidth+'px';
  fx.style.height = innerHeight+'px';
} addEventListener('resize',resizeFx); resizeFx();
const DPR = Math.min(2,window.devicePixelRatio||1);
const hearts=[];
function spawnHearts(x,y,n=20){
  x*=DPR; y*=DPR;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    hearts.push({x,y,vx:Math.cos(a)*(0.6+Math.random()*0.8),vy:-(0.8+Math.random()*1.2),life:1,size:10+Math.random()*16});
  }
}
function drawHeart(x,y,size){
  const s=size; ctx2.save(); ctx2.translate(x,y);
  ctx2.beginPath(); ctx2.moveTo(0,-0.25*s);
  ctx2.bezierCurveTo(.5*s,-.9*s,1.4*s,-.1*s,0,.9*s);
  ctx2.bezierCurveTo(-1.4*s,-.1*s,-.5*s,-.9*s,0,-.25*s);
  const g=ctx2.createRadialGradient(0,0,0,0,0,s);
  // 04/05/2026: cambié los colores del degradado para que sean más azules y celestes, y menos rosas, espero que te gusten más así :D
  // corazones azules/celestes
  g.addColorStop(0,'rgba(150,210,255,.95)'); g.addColorStop(1,'rgba(50,130,255,0)');
  ctx2.fillStyle=g; ctx2.fill(); ctx2.restore();
}
let lastTap=0;
addEventListener('click',(e)=>{ const now=performance.now(); if(now-lastTap<320) spawnHearts(e.clientX,e.clientY,20); lastTap=now; },{passive:true});
addEventListener('touchend',(e)=>{ const now=performance.now(); const t0=e.changedTouches&&e.changedTouches[0]; if(now-lastTap<320&&t0) spawnHearts(t0.clientX,t0.clientY,20); lastTap=now; },{passive:true});

function loopFx(){
  ctx2.clearRect(0,0,fx.width,fx.height);
  for(let i=hearts.length-1;i>=0;i--){ const h=hearts[i]; h.x+=h.vx; h.y+=h.vy; h.vy-=0.02; h.life-=0.015;
    ctx2.globalAlpha=Math.max(0,h.life); drawHeart(h.x,h.y,h.size); ctx2.globalAlpha=1; if(h.life<=0) hearts.splice(i,1);
  }
  requestAnimationFrame(loopFx);
} loopFx();

function openMsg(){
  // El mensaje especial de texto tiene probabilidad de 0.00001%
  const SPECIAL_TEXT_IDX = frasesPopup.findIndex(f => f.text && f.text.startsWith("Ya enserio"));

  let idx;
  const roll = Math.random() * 100;
  if(roll < 0.00001 && SPECIAL_TEXT_IDX !== -1 && SPECIAL_TEXT_IDX !== lastFraseIdx){
    idx = SPECIAL_TEXT_IDX;
  } else {
    // Pool: todos los mensajes excepto el especial de texto
    const pool = frasesPopup
      .map((_,i) => i)
      .filter(i => i !== SPECIAL_TEXT_IDX);
    let pick; do { pick = Math.floor(Math.random()*pool.length); } while(pool[pick]===lastFraseIdx && pool.length>1);
    idx = pool[pick];
  }
  lastFraseIdx = idx;
  const f = frasesPopup[idx];
  msgIco.textContent = f.icon;
  if(f.image){
    msgTxt.innerHTML = '';
    const img = document.createElement('img');
    img.src = f.image;
    img.style.cssText = 'max-width:100%;max-height:220px;border-radius:12px;object-fit:cover;margin-top:0.4rem;';
    msgTxt.appendChild(img);
  } else {
    msgTxt.textContent = f.text;
  }
  msgBox.classList.add('visible');
  msgOpen = true;
}
function closeMsg(){ msgBox.classList.remove('visible'); msgOpen = false; }
msgCerrar.addEventListener('click', e => { e.stopPropagation(); closeMsg(); });
msgBox.addEventListener('click', e => e.stopPropagation());

const raycaster = new THREE.Raycaster();
const mouse2 = new THREE.Vector2();
let ptrDown = null;

canvas.addEventListener('pointerdown', e => { ptrDown = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if(!ptrDown) return;
  const moved = Math.hypot(e.clientX - ptrDown.x, e.clientY - ptrDown.y);
  ptrDown = null;
  if(moved > 8) return;
  if(msgOpen){ closeMsg(); return; }
  mouse2.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  mouse2.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse2, camera);
  if(raycaster.intersectObject(core).length > 0) openMsg();
});

} catch(e){ showError('Error: '+e.message); console.error(e); }
})();
